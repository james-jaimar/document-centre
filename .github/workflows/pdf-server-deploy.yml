name: Deploy pdf-server to Cloud Run

# Phase 1 of the GCP cutover (see .lovable/plan.md):
#   - Builds the image, pushes to Artifact Registry.
#   - Deploys ONLY the pdf-api service (FastAPI sync endpoints).
#   - All runtime config comes from GCP Secret Manager via --set-secrets.
#   - Celery workers, beat, and the email listener stay on the VPS until
#     Phase 3 / Phase 5 of the plan.
#
# Required Secret Manager entries (create once via pdf-server/docker/secrets-bootstrap.sh):
#   PDF_DATABASE_URL, PDF_SUPABASE_URL, PDF_SUPABASE_SERVICE_ROLE_KEY,
#   PDF_STORAGE_MODE, PDF_AWS_S3_BUCKET, PDF_AWS_S3_REGION,
#   PDF_AWS_ACCESS_KEY_ID, PDF_AWS_SECRET_ACCESS_KEY,
#   PDF_SECRET_KEY, PDF_CORS_ORIGINS
# Optional: PDF_SUPABASE_STORAGE_BUCKET, PDF_ADMIN_USERNAME, PDF_ADMIN_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'pdf-server/**'
      - '.github/workflows/pdf-server-deploy.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional: redeploy a previous commit SHA (40-char hash)'
        required: false
        type: string

env:
  GCP_PROJECT_ID: project-59a14b18-b4df-4c6b-b09
  GCP_PROJECT_NUMBER: '622687766375'
  GCP_REGION: africa-south1
  AR_REPO: dc-pdf
  IMAGE_NAME: server
  WIF_PROVIDER: projects/622687766375/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deployer@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com
  RUNTIME_SA: dc-pdf-runtime@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

# Silence the Node 20 deprecation warning on the runner. Safe to remove once
# google-github-actions/* ship Node 24 builds.
defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          SHA="${{ github.event.inputs.rollback_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Verify required Secret Manager entries exist
        run: |
          required=(PDF_DATABASE_URL PDF_SUPABASE_URL PDF_SUPABASE_SERVICE_ROLE_KEY \
                    PDF_SECRET_KEY PDF_CORS_ORIGINS PDF_STORAGE_MODE \
                    PDF_AWS_S3_BUCKET PDF_AWS_S3_REGION \
                    PDF_AWS_ACCESS_KEY_ID PDF_AWS_SECRET_ACCESS_KEY)
          missing=()
          denied=()
          for s in "${required[@]}"; do
            err=$(gcloud secrets describe "$s" --project="${GCP_PROJECT_ID}" 2>&1 >/dev/null) && continue
            if echo "$err" | grep -qi 'PERMISSION_DENIED\|does not have permission'; then
              denied+=("$s")
            else
              missing+=("$s")
            fi
          done
          if [ ${#denied[@]} -gt 0 ]; then
            echo "::error::Deploy SA cannot read these secrets (PERMISSION_DENIED): ${denied[*]}"
            echo "::error::Fix with ONE of (run in Cloud Shell):"
            echo "::error::  A) bash pdf-server/docker/secrets-bootstrap.sh --iam-only"
            echo "::error::  B) bash pdf-server/docker/gcp-setup.sh"
            echo "::error::  C) gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} \\"
            echo "::error::       --member=serviceAccount:${DEPLOY_SA} --role=roles/secretmanager.viewer"
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Secret Manager entries: ${missing[*]}"
            echo "Create them by running: bash pdf-server/docker/secrets-bootstrap.sh"
            exit 1
          fi

      - name: Build image
        if: github.event.inputs.rollback_sha == ''
        run: |
          docker build \
            -f pdf-server/Dockerfile \
            -t "${{ steps.tag.outputs.image }}" \
            .

      - name: Push image
        if: github.event.inputs.rollback_sha == ''
        run: docker push "${{ steps.tag.outputs.image }}"

      - name: Deploy pdf-api (HTTP)
        run: |
          # Optional secrets are added to --set-secrets only if they exist,
          # so the first deploy works even before AWS / admin secrets are set.
          BASE_SECRETS=(
            "DATABASE_URL=PDF_DATABASE_URL:latest"
            "SUPABASE_URL=PDF_SUPABASE_URL:latest"
            "SUPABASE_SERVICE_ROLE_KEY=PDF_SUPABASE_SERVICE_ROLE_KEY:latest"
            "SECRET_KEY=PDF_SECRET_KEY:latest"
            "CORS_ORIGINS=PDF_CORS_ORIGINS:latest"
            "STORAGE_MODE=PDF_STORAGE_MODE:latest"
            "AWS_S3_BUCKET=PDF_AWS_S3_BUCKET:latest"
            "AWS_S3_REGION=PDF_AWS_S3_REGION:latest"
            "AWS_ACCESS_KEY_ID=PDF_AWS_ACCESS_KEY_ID:latest"
            "AWS_SECRET_ACCESS_KEY=PDF_AWS_SECRET_ACCESS_KEY:latest"
          )
          OPTIONAL=(
            "SUPABASE_STORAGE_BUCKET=PDF_SUPABASE_STORAGE_BUCKET"
            "ADMIN_USERNAME=PDF_ADMIN_USERNAME"
            "ADMIN_PASSWORD=PDF_ADMIN_PASSWORD"
          )
          SECRETS=("${BASE_SECRETS[@]}")
          for entry in "${OPTIONAL[@]}"; do
            env_name="${entry%%=*}"
            sec_name="${entry##*=}"
            if gcloud secrets describe "$sec_name" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              SECRETS+=("${env_name}=${sec_name}:latest")
            fi
          done
          SECRET_FLAG=$(IFS=,; echo "${SECRETS[*]}")

          gcloud run deploy pdf-api \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --port=8080 \
            --set-env-vars="ROLE=api,LOG_LEVEL=INFO,APP_ENV=production" \
            --set-secrets="$SECRET_FLAG" \
            --memory=1Gi --cpu=1 \
            --concurrency=80 \
            --min-instances=0 --max-instances=10 \
            --timeout=300 \
            --allow-unauthenticated \
            --quiet

      - name: Summary
        run: |
          URL=$(gcloud run services describe pdf-api --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          {
            echo "## Deployed"
            echo ""
            echo "- **Service**: pdf-api"
            echo "- **URL**: $URL"
            echo "- **Image**: \`${{ steps.tag.outputs.image }}\`"
            echo "- **Commit**: \`${{ steps.tag.outputs.sha }}\`"
            echo "- **Region**: ${{ env.GCP_REGION }}"
            echo ""
            echo "_Workers (heavy/light/emails) and beat remain on the VPS until Phase 3 of the cutover plan._"
          } >> "$GITHUB_STEP_SUMMARY"
