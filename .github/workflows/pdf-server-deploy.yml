name: Deploy pdf-server to Cloud Run

# Phase 1 of the GCP cutover (see .lovable/plan.md):
#   - Builds the image, pushes to Artifact Registry.
#   - Deploys ONLY the pdf-api service (FastAPI sync endpoints).
#   - All runtime config comes from GCP Secret Manager via --set-secrets.
#   - Celery workers, beat, and the email listener stay on the VPS until
#     Phase 3 / Phase 5 of the plan.
#
# Required Secret Manager entries (create once via pdf-server/docker/secrets-bootstrap.sh):
#   PDF_DATABASE_URL, PDF_SUPABASE_URL, PDF_SUPABASE_SERVICE_ROLE_KEY,
#   PDF_STORAGE_MODE, PDF_AWS_S3_BUCKET, PDF_AWS_S3_REGION,
#   PDF_AWS_ACCESS_KEY_ID, PDF_AWS_SECRET_ACCESS_KEY,
#   PDF_SECRET_KEY, PDF_CORS_ORIGINS
# Optional: PDF_SUPABASE_STORAGE_BUCKET, PDF_ADMIN_USERNAME, PDF_ADMIN_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'pdf-server/**'
      - '.github/workflows/pdf-server-deploy.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional: redeploy a previous commit SHA (40-char hash)'
        required: false
        type: string

env:
  # Opt into Node 24 now so the forced switch on June 16th 2026 doesn't
  # surprise us. Silences the Node 20 deprecation warning on every run.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  GCP_PROJECT_ID: project-59a14b18-b4df-4c6b-b09
  GCP_PROJECT_NUMBER: '622687766375'
  GCP_REGION: africa-south1
  # Cloud Tasks + Cloud Scheduler are not offered in africa-south1.
  # Queue control plane lives in europe-west1; pushes back into africa-south1 Cloud Run.
  GCP_TASKS_REGION: europe-west1
  AR_REPO: dc-pdf
  IMAGE_NAME: server
  # Non-secret SHA-256 prefix of the Microsoft OAuth client ID used by the
  # Supabase Edge Function that mints refresh tokens. The email worker MUST
  # use the same Entra app; mismatches produce AADSTS90013 on refresh.
  MICROSOFT_OAUTH_CLIENT_FP_EXPECTED: c1932231
  WIF_PROVIDER: projects/622687766375/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deployer@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com
  RUNTIME_SA: dc-pdf-runtime@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

# Silence the Node 20 deprecation warning on the runner. Safe to remove once
# google-github-actions/* ship Node 24 builds.
defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub (avoid anonymous pull rate limits)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: tag
        run: |
          SHA="${{ github.event.inputs.rollback_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Verify required Secret Manager entries exist
        run: |
          required=(PDF_DATABASE_URL PDF_SUPABASE_URL PDF_SUPABASE_SERVICE_ROLE_KEY \
                    PDF_SECRET_KEY PDF_CORS_ORIGINS PDF_STORAGE_MODE \
                    PDF_AWS_S3_BUCKET PDF_AWS_S3_REGION \
                    PDF_AWS_ACCESS_KEY_ID PDF_AWS_SECRET_ACCESS_KEY)
          missing=()
          denied=()
          for s in "${required[@]}"; do
            err=$(gcloud secrets describe "$s" --project="${GCP_PROJECT_ID}" 2>&1 >/dev/null) && continue
            if echo "$err" | grep -qi 'PERMISSION_DENIED\|does not have permission'; then
              denied+=("$s")
            else
              missing+=("$s")
            fi
          done
          if [ ${#denied[@]} -gt 0 ]; then
            echo "::error::Deploy SA cannot read these secrets (PERMISSION_DENIED): ${denied[*]}"
            echo "::error::Fix with ONE of (run in Cloud Shell):"
            echo "::error::  A) bash pdf-server/docker/secrets-bootstrap.sh --iam-only"
            echo "::error::  B) bash pdf-server/docker/gcp-setup.sh"
            echo "::error::  C) gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} \\"
            echo "::error::       --member=serviceAccount:${DEPLOY_SA} --role=roles/secretmanager.viewer"
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Secret Manager entries: ${missing[*]}"
            echo "Create them by running: bash pdf-server/docker/secrets-bootstrap.sh"
            exit 1
          fi


      - name: Verify deploy SA can read Cloud Run logs
        run: |
          # Without roles/logging.viewer the post-deploy log dump returns
          # PERMISSION_DENIED and hides the real Cloud Run startup error.
          # Fail fast with the exact grant command instead.
          if ! err=$(gcloud logging read \
                'resource.type="cloud_run_revision" AND resource.labels.service_name="pdf-api"' \
                --project="${GCP_PROJECT_ID}" --limit=1 --format='value(timestamp)' 2>&1); then
            if echo "$err" | grep -qi 'PERMISSION_DENIED\|does not have permission'; then
              echo "::error::Deploy SA lacks roles/logging.viewer — Cloud Run startup logs cannot be read."
              echo "::error::Run ONE of (in Cloud Shell):"
              echo "::error::  A) bash pdf-server/docker/gcp-setup.sh"
              echo "::error::  B) gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} \\"
              echo "::error::       --member=serviceAccount:${DEPLOY_SA} \\"
              echo "::error::       --role=roles/logging.viewer --condition=None"
              exit 1
            fi
            echo "::warning::Unexpected error probing Cloud Run logs: $err"
          fi

      - name: Build image (with registry layer cache)
        if: github.event.inputs.rollback_sha == ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: pdf-server/Dockerfile
          tags: ${{ steps.tag.outputs.image }}
          load: true
          push: false
          cache-from: type=registry,ref=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.AR_REPO }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

      - name: Container boot smoke test (catch startup failures before Cloud Run rollout)
        if: github.event.inputs.rollback_sha == ''
        run: |
          # Start the same ROLE=api entrypoint Cloud Run uses, bind PORT=8080,
          # and require /health to answer before deploying. Single worker +
          # debug logging so any Python traceback shows up in docker logs.
          cid=$(docker run -d \
            -e ROLE=api \
            -e PORT=8080 \
            -e UVICORN_WORKERS=1 \
            -e LOG_LEVEL=debug \
            -e PYTHONUNBUFFERED=1 \
            -e APP_DEBUG=true \
            -e DATABASE_URL="postgresql+psycopg://u:p@127.0.0.1:5432/db" \
            -e STORAGE_MODE=s3 \
            -e AWS_S3_BUCKET=smoke -e AWS_S3_REGION=af-south-1 \
            -e AWS_ACCESS_KEY_ID=smoke -e AWS_SECRET_ACCESS_KEY=smoke \
            -e SECRET_KEY=smoke \
            -e CORS_ORIGINS="http://localhost" \
            -p 127.0.0.1:8080:8080 \
            "${{ steps.tag.outputs.image }}")

          dump_logs() {
            echo "===== docker logs (pdf-api smoke) ====="
            docker logs "$cid" 2>&1 || true
            echo "===== end docker logs ====="
          }
          cleanup() { dump_logs; docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/pdf-api-health.json 2>/dev/null; then
              echo "/health OK:"
              cat /tmp/pdf-api-health.json
              exit 0
            fi
            running=$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo "missing")
            if [ "$running" != "true" ]; then
              status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo unknown)
              exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$cid" 2>/dev/null || echo unknown)
              echo "::error::Container exited before /health became ready (status=$status, exit_code=$exit_code)"
              exit 1
            fi
            sleep 2
          done

          echo "::error::Container did not answer /health on PORT=8080 within 90s"
          exit 1

      - name: Push image
        if: github.event.inputs.rollback_sha == ''
        run: docker push "${{ steps.tag.outputs.image }}"

      - name: Deploy pdf-api (HTTP)
        run: |
          # Optional secrets are added to --set-secrets only if they exist,
          # so the first deploy works even before AWS / admin secrets are set.
          BASE_SECRETS=(
            "DATABASE_URL=PDF_DATABASE_URL:latest"
            "SUPABASE_URL=PDF_SUPABASE_URL:latest"
            "SUPABASE_SERVICE_ROLE_KEY=PDF_SUPABASE_SERVICE_ROLE_KEY:latest"
            "SECRET_KEY=PDF_SECRET_KEY:latest"
            "CORS_ORIGINS=PDF_CORS_ORIGINS:latest"
            "STORAGE_MODE=PDF_STORAGE_MODE:latest"
            "AWS_S3_BUCKET=PDF_AWS_S3_BUCKET:latest"
            "AWS_S3_REGION=PDF_AWS_S3_REGION:latest"
            "AWS_ACCESS_KEY_ID=PDF_AWS_ACCESS_KEY_ID:latest"
            "AWS_SECRET_ACCESS_KEY=PDF_AWS_SECRET_ACCESS_KEY:latest"
          )
          OPTIONAL=(
            "SUPABASE_STORAGE_BUCKET=PDF_SUPABASE_STORAGE_BUCKET"
            "ADMIN_USERNAME=PDF_ADMIN_USERNAME"
            "ADMIN_PASSWORD=PDF_ADMIN_PASSWORD"
            # Shared secret used by the Supabase Database Webhook that
            # replaces the VPS LISTEN/NOTIFY listener. Optional so deploys
            # don't break before the secret is created.
            "EMAIL_NOTIFY_TOKEN=PDF_EMAIL_NOTIFY_TOKEN"
          )
          SECRETS=("${BASE_SECRETS[@]}")
          for entry in "${OPTIONAL[@]}"; do
            env_name="${entry%%=*}"
            sec_name="${entry##*=}"
            if gcloud secrets describe "$sec_name" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              SECRETS+=("${env_name}=${sec_name}:latest")
            fi
          done
          SECRET_FLAG=$(IFS=,; echo "${SECRETS[*]}")

          set +e
          gcloud run deploy pdf-api \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --port=8080 \
            --set-env-vars="ROLE=api,LOG_LEVEL=INFO,APP_ENV=production,UVICORN_WORKERS=1,PYTHONUNBUFFERED=1,QUEUE_BACKEND=cloud_tasks,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},GCP_TASKS_REGION=${{ env.GCP_TASKS_REGION }},CLOUD_TASKS_DISPATCH_DEADLINE_SECONDS=900" \
            --set-secrets="$SECRET_FLAG" \
            --memory=1Gi --cpu=1 \
            --cpu-boost \
            --concurrency=80 \
            --min-instances=0 --max-instances=10 \
            --timeout=300 \
            --allow-unauthenticated \
            --quiet
          deploy_rc=$?
          set -e
          if [ $deploy_rc -ne 0 ]; then
            echo "::error::gcloud run deploy failed (rc=$deploy_rc). Dumping recent Cloud Run logs for pdf-api:"
            echo "===== cloud run logs (pdf-api, last 200) ====="
            gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="pdf-api"' \
              --project="${GCP_PROJECT_ID}" \
              --limit=200 \
              --order=desc \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            echo "===== end cloud run logs ====="
            exit $deploy_rc
          fi

      - name: Deploy HTTP workers (Cloud Tasks targets)
        run: |
          # Same image, different ROLE. Each service gets its own scaling
          # envelope. Cloud Tasks pushes /internal/tasks/* requests here.
          # NOT --allow-unauthenticated — only the cloud-tasks-invoker SA
          # (created by gcp-tasks-bootstrap.sh) may invoke. WORKER_SELF_URL
          # is set in a second pass below once the URL exists.
          SECRETS=(
            "DATABASE_URL=PDF_DATABASE_URL:latest"
            "SUPABASE_URL=PDF_SUPABASE_URL:latest"
            "SUPABASE_SERVICE_ROLE_KEY=PDF_SUPABASE_SERVICE_ROLE_KEY:latest"
            "SECRET_KEY=PDF_SECRET_KEY:latest"
            "CORS_ORIGINS=PDF_CORS_ORIGINS:latest"
            "STORAGE_MODE=PDF_STORAGE_MODE:latest"
            "AWS_S3_BUCKET=PDF_AWS_S3_BUCKET:latest"
            "AWS_S3_REGION=PDF_AWS_S3_REGION:latest"
            "AWS_ACCESS_KEY_ID=PDF_AWS_ACCESS_KEY_ID:latest"
            "AWS_SECRET_ACCESS_KEY=PDF_AWS_SECRET_ACCESS_KEY:latest"
          )
          SECRET_FLAG=$(IFS=,; echo "${SECRETS[*]}")

          deploy_worker() {
            local name="$1" role="$2" cpu="$3" mem="$4" max="$5" min="${6:-0}" extra_env="${7:-}"
            # NOTE: QUEUE_BACKEND=cloud_tasks must be on workers too — not just
            # pdf-api. Without it, generate_previews on pdf-worker-light defaults
            # to the Celery fan-out path and an enqueue() call from inside a
            # worker task (e.g. scan_outbox → send_email) tries to use Redis,
            # which doesn't exist on Cloud Run. Symptom: 24-page preview job
            # restarts/salvages in a loop because per-page "render_one_page"
            # dispatches go nowhere.
            #
            # `--set-env-vars` is a FULL REPLACE — anything omitted here gets
            # dropped on every deploy. The pdf-worker-light batch-pipeline
            # tunables (PREVIEW_PIPELINE_MODE, PREVIEW_FORCE_SEQUENTIAL,
            # PREVIEW_GS_THREADS=4, RENDER_CPU_CONCURRENCY=4) are appended
            # via extra_env at the call site below; do NOT move them into
            # the shared base unless every worker needs them.
            local base_env="ROLE=${role},LOG_LEVEL=INFO,APP_ENV=production,UVICORN_WORKERS=1,PYTHONUNBUFFERED=1,QUEUE_BACKEND=cloud_tasks,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},GCP_TASKS_REGION=${{ env.GCP_TASKS_REGION }},CLOUD_TASKS_DISPATCH_DEADLINE_SECONDS=900,S3_MAX_POOL_CONNECTIONS=32,PDF_CACHE_ENABLED=true,PDF_CACHE_DIR=/tmp/pdf-cache,PREVIEW_GS_THREADS=1,PREVIEW_GS_BATCH_TIMEOUT_SECONDS=90,PREVIEW_GS_PAGE_TIMEOUT_SECONDS=20,PREVIEW_RENDER_BOX_MODE=metadata_only,PREVIEW_MUTOOL_SALVAGE_ENABLED=false,PREVIEW_PAGE_MAX_RETRIES=1,RENDER_CPU_CONCURRENCY=3,RENDER_IO_CONCURRENCY=8"
            if [ "$name" = "pdf-worker-emails" ]; then
              base_env="${base_env},MICROSOFT_OAUTH_CLIENT_FP_EXPECTED=${{ env.MICROSOFT_OAUTH_CLIENT_FP_EXPECTED }}"
            fi
            local env_flag="$base_env"
            if [ -n "$extra_env" ]; then
              env_flag="${base_env},${extra_env}"
            fi
            gcloud run deploy "$name" \
              --image="${{ steps.tag.outputs.image }}" \
              --region="${{ env.GCP_REGION }}" \
              --service-account="${{ env.RUNTIME_SA }}" \
              --port=8080 \
              --set-env-vars="$env_flag" \
              --set-secrets="$SECRET_FLAG" \
              --memory="$mem" --cpu="$cpu" \
              --cpu-boost \
              --concurrency=1 \
              --min-instances="$min" --max-instances="$max" \
              --timeout=900 \
              --no-allow-unauthenticated \
              --quiet

            # Second pass: set WORKER_SELF_URL so OIDC verification can match audience.
            url=$(gcloud run services describe "$name" --region="${{ env.GCP_REGION }}" --format='value(status.url)')
            gcloud run services update "$name" \
              --region="${{ env.GCP_REGION }}" \
              --update-env-vars="WORKER_SELF_URL=$url" --quiet

            # Move 100% traffic to the revision we just rolled out. The
            # batchfix recovery had pdf-worker-light pinned to a named
            # revision; without --to-latest, future deploys would build a
            # new revision but the old one would keep serving traffic.
            gcloud run services update-traffic "$name" \
              --region="${{ env.GCP_REGION }}" \
              --to-latest --quiet
          }

          # Heavy: pin min=1 so prepare_for_product doesn't pay a cold
          # start on every customer upload (it sits in the critical path
          # before generate_previews). 2 vCPU × 4 GiB × 1 instance = ~£20/mo
          # for the SLA improvement.
          deploy_worker pdf-worker-heavy  worker-heavy-http  2 4Gi  5 1
          # Light worker: customer-facing thumbnail render. 4 vCPU × 4 GiB
          # with concurrency=1 — the batch render-first pipeline uses all
          # 4 cores via PREVIEW_GS_THREADS=4 + RENDER_CPU_CONCURRENCY=4
          # and 8 IO threads for parallel S3 uploads. min=1 keeps the
          # worker warm so the first thumbnail of a quiet period doesn't
          # cold-start. PREVIEW_PIPELINE_MODE=batch is the render-first
          # single-GS-invocation path; PREVIEW_FORCE_SEQUENTIAL=false is
          # the rollback kill-switch (set true to drop back to the legacy
          # per-page path without redeploying).
          deploy_worker pdf-worker-light  worker-light-http  4 4Gi  20 1 \
            "PREVIEW_PIPELINE_MODE=batch,PREVIEW_FORCE_SEQUENTIAL=false,PREVIEW_GS_THREADS=4,RENDER_CPU_CONCURRENCY=4,RENDER_IO_CONCURRENCY=8"
          # Emails: bumped max-instances 10 → 20 and pinned min=1 so the
          # first email after a quiet period doesn't pay a cold start.
          # 512 MiB × 1 min-instance ≈ trivial cost vs. SMTP latency saved.
          deploy_worker pdf-worker-emails worker-emails-http 1 512Mi 20 1

          # Per-tenant OAuth client creds for self-serve mailbox connect.
          # Only the emails worker needs them; only required when a tenant
          # is on transport=gmail_oauth or transport=graph_oauth. Each pair
          # is added independently so a Gmail-only or Microsoft-only setup
          # still mounts what it has.
          mount_oauth_pair() {
            local id_secret="$1" sec_secret="$2" id_env="$3" sec_env="$4" label="$5"
            if gcloud secrets describe "$id_secret" --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1 \
               && gcloud secrets describe "$sec_secret" --project="${{ env.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
              gcloud run services update pdf-worker-emails \
                --region="${{ env.GCP_REGION }}" \
                --update-secrets="${id_env}=${id_secret}:latest,${sec_env}=${sec_secret}:latest" \
                --quiet
              echo "${label} OAuth secrets mounted on pdf-worker-emails."
            else
              echo "::warning::${id_secret} / ${sec_secret} not in GCP Secret Manager — ${label} OAuth tenants will fail with config_missing. SMTP and other transports are unaffected."
            fi
          }

          mount_oauth_pair GMAIL_OAUTH_CLIENT_ID     GMAIL_OAUTH_CLIENT_SECRET     GMAIL_OAUTH_CLIENT_ID     GMAIL_OAUTH_CLIENT_SECRET     "Gmail"
          mount_oauth_pair MICROSOFT_OAUTH_CLIENT_ID MICROSOFT_OAUTH_CLIENT_SECRET MICROSOFT_OAUTH_CLIENT_ID MICROSOFT_OAUTH_CLIENT_SECRET "Microsoft"

          # Bounce traffic to the latest revision once secrets are applied.
          gcloud run services update-traffic pdf-worker-emails \
            --region="${{ env.GCP_REGION }}" \
            --to-latest --quiet





      - name: Wire Cloud Tasks env vars on pdf-api AND workers
        run: |
          # pdf-api gets BEAT_SELF_URL (for OIDC audience on beat endpoints)
          # + the Cloud Tasks enqueue config (TASKS_INVOKER_SA + per-queue
          # worker URLs). Workers ALSO get the enqueue config so any task
          # that calls enqueue() from inside a worker (e.g. scan_outbox →
          # send_email, normalize_asset → generate_previews) can push via
          # Cloud Tasks rather than falling back to Celery/Redis.
          api_url=$(gcloud run services describe pdf-api          --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          heavy_url=$(gcloud run services describe pdf-worker-heavy  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          light_url=$(gcloud run services describe pdf-worker-light  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          emails_url=$(gcloud run services describe pdf-worker-emails --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          invoker_sa="cloud-tasks-invoker@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

          shared_tasks_env="TASKS_INVOKER_SA=${invoker_sa},WORKER_URL_HEAVY=${heavy_url},WORKER_URL_LIGHT=${light_url},WORKER_URL_EMAILS=${emails_url},QUEUE_BACKEND=cloud_tasks"

          gcloud run services update pdf-api \
            --region="${{ env.GCP_REGION }}" \
            --update-env-vars="BEAT_SELF_URL=${api_url},${shared_tasks_env}" \
            --quiet

          for worker in pdf-worker-heavy pdf-worker-light pdf-worker-emails; do
            gcloud run services update "$worker" \
              --region="${{ env.GCP_REGION }}" \
              --update-env-vars="$shared_tasks_env" \
              --quiet
          done

      - name: Verify live revisions, env, and summarise
        run: |
          # Litmus tests run on every deploy:
          #   1. status.traffic[0].revisionName == status.latestReadyRevisionName
          #      (no orphan deploys serving stale code)
          #   2. pdf-worker-light's LIVE revision exposes the batch-pipeline
          #      env (PREVIEW_PIPELINE_MODE=batch, PREVIEW_FORCE_SEQUENTIAL=false,
          #      PREVIEW_GS_THREADS=4, RENDER_CPU_CONCURRENCY=4,
          #      RENDER_IO_CONCURRENCY=8, ROLE=worker-light-http,
          #      QUEUE_BACKEND=cloud_tasks)
          # Both fail the job with the exact fix command if they drift.
          set -e
          REGION="${{ env.GCP_REGION }}"

          declare -A LIVE_REV LIVE_URL LIVE_IMAGE LIVE_DIGEST
          fail=0

          for svc in pdf-api pdf-worker-heavy pdf-worker-light pdf-worker-emails; do
            latest=$(gcloud run services describe "$svc" --region="$REGION" \
              --format='value(status.latestReadyRevisionName)')
            live=$(gcloud run services describe "$svc" --region="$REGION" \
              --format='value(status.traffic[0].revisionName)')
            url=$(gcloud run services describe "$svc" --region="$REGION" \
              --format='value(status.url)')
            LIVE_REV[$svc]="$live"
            LIVE_URL[$svc]="$url"
            if [ "$live" != "$latest" ]; then
              echo "::error::Service $svc is serving $live but latestReadyRevisionName=$latest."
              echo "::error::Fix: gcloud run services update-traffic $svc --region=$REGION --to-latest"
              fail=1
            fi
            # Capture the image (with digest if pinned) of the LIVE revision.
            img=$(gcloud run revisions describe "$live" --region="$REGION" \
              --format='value(spec.containers[0].image)' 2>/dev/null || echo "-")
            LIVE_IMAGE[$svc]="$img"
            digest=$(gcloud run revisions describe "$live" --region="$REGION" \
              --format='value(status.imageDigest)' 2>/dev/null || echo "-")
            LIVE_DIGEST[$svc]="$digest"
          done

          # Verify pdf-worker-light env on the LIVE revision.
          light_live="${LIVE_REV[pdf-worker-light]}"
          env_json=$(gcloud run revisions describe "$light_live" --region="$REGION" --format=json)
          required_env=(
            "PREVIEW_PIPELINE_MODE=batch"
            "PREVIEW_FORCE_SEQUENTIAL=false"
            "PREVIEW_GS_THREADS=4"
            "RENDER_CPU_CONCURRENCY=4"
            "RENDER_IO_CONCURRENCY=8"
            "ROLE=worker-light-http"
            "QUEUE_BACKEND=cloud_tasks"
          )
          declare -A LIVE_LIGHT_ENV
          for kv in "${required_env[@]}"; do
            key="${kv%%=*}"
            want="${kv#*=}"
            got=$(echo "$env_json" | jq -r --arg k "$key" '.spec.containers[0].env[]? | select(.name==$k) | .value // ""')
            LIVE_LIGHT_ENV[$key]="$got"
            if [ "$got" != "$want" ]; then
              echo "::error::pdf-worker-light env drift: $key=$got (expected $want) on $light_live"
              echo "::error::Fix: re-run this workflow, or:"
              echo "::error::  gcloud run services update pdf-worker-light --region=$REGION \\"
              echo "::error::    --update-env-vars='$kv'"
              fail=1
            fi
          done

          # Verify pdf-worker-emails LIVE revision has the right ROLE,
          # QUEUE_BACKEND, AND that the Microsoft OAuth secrets are mounted.
          # Without these the worker falls back to the old credential path
          # and fails graph_oauth rows with "transport not yet implemented".
          emails_live="${LIVE_REV[pdf-worker-emails]}"
          emails_json=$(gcloud run revisions describe "$emails_live" --region="$REGION" --format=json)
          emails_required_env=(
            "ROLE=worker-emails-http"
            "QUEUE_BACKEND=cloud_tasks"
          )
          declare -A LIVE_EMAILS_ENV
          for kv in "${emails_required_env[@]}"; do
            key="${kv%%=*}"
            want="${kv#*=}"
            got=$(echo "$emails_json" | jq -r --arg k "$key" '.spec.containers[0].env[]? | select(.name==$k) | .value // ""')
            LIVE_EMAILS_ENV[$key]="$got"
            if [ "$got" != "$want" ]; then
              echo "::error::pdf-worker-emails env drift: $key=$got (expected $want) on $emails_live"
              echo "::error::Fix: re-run this workflow, or:"
              echo "::error::  gcloud run services update pdf-worker-emails --region=$REGION \\"
              echo "::error::    --update-env-vars='$kv'"
              fail=1
            fi
          done

          # Microsoft / Gmail OAuth secret mounts (valueFrom.secretKeyRef.name).
          declare -A LIVE_EMAILS_SECRETS
          oauth_required_secrets=(
            "MICROSOFT_OAUTH_CLIENT_ID"
            "MICROSOFT_OAUTH_CLIENT_SECRET"
          )
          for s in "${oauth_required_secrets[@]}"; do
            mounted=$(echo "$emails_json" | jq -r --arg k "$s" \
              '.spec.containers[0].env[]? | select(.name==$k) | .valueFrom.secretKeyRef.name // ""')
            LIVE_EMAILS_SECRETS[$s]="$mounted"
            if [ -z "$mounted" ]; then
              echo "::error::pdf-worker-emails missing OAuth secret mount: $s (graph_oauth tenants will fail)"
              echo "::error::Fix: ensure GCP Secret Manager has $s and re-run this workflow."
              fail=1
            fi
          done



          {
            echo "## Deployed"
            echo ""
            echo "- **Image (built)**: \`${{ steps.tag.outputs.image }}\`"
            echo "- **Commit**: \`${{ steps.tag.outputs.sha }}\`"
            echo "- **Region**: $REGION"
            echo ""
            echo "### Live revisions (traffic = latestReadyRevisionName)"
            echo ""
            echo "| Service | Live revision | URL | Live image |"
            echo "| --- | --- | --- | --- |"
            for svc in pdf-api pdf-worker-heavy pdf-worker-light pdf-worker-emails; do
              echo "| \`$svc\` | \`${LIVE_REV[$svc]}\` | ${LIVE_URL[$svc]} | \`${LIVE_IMAGE[$svc]}\` |"
            done
            echo ""
            echo "### pdf-worker-light batch-pipeline env (LIVE revision \`${LIVE_REV[pdf-worker-light]}\`)"
            echo ""
            echo "| Key | Live value |"
            echo "| --- | --- |"
            for kv in "${required_env[@]}"; do
              key="${kv%%=*}"
              echo "| \`$key\` | \`${LIVE_LIGHT_ENV[$key]}\` |"
            done
            echo ""
            if [ "${LIVE_DIGEST[pdf-worker-light]}" != "-" ] && [ -n "${LIVE_DIGEST[pdf-worker-light]}" ]; then
              echo "_pdf-worker-light image digest: \`${LIVE_DIGEST[pdf-worker-light]}\`_"
            fi
            echo ""
            echo "### pdf-worker-emails env (LIVE revision \`${LIVE_REV[pdf-worker-emails]}\`)"
            echo ""
            echo "| Key | Live value |"
            echo "| --- | --- |"
            for kv in "${emails_required_env[@]}"; do
              key="${kv%%=*}"
              echo "| \`$key\` | \`${LIVE_EMAILS_ENV[$key]}\` |"
            done
            for s in "${oauth_required_secrets[@]}"; do
              mounted="${LIVE_EMAILS_SECRETS[$s]:-<not mounted>}"
              echo "| \`$s\` (secret) | \`${mounted}\` |"
            done
            echo ""
            echo "_First-time setup: run \`bash pdf-server/docker/gcp-tasks-bootstrap.sh\` in Cloud Shell to create Cloud Tasks queues, the invoker SA, and Cloud Scheduler jobs._"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$fail" -ne 0 ]; then
            echo "::error::Post-deploy verification failed — see annotations above."
            exit 1
          fi

