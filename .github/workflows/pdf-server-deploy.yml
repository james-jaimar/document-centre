name: Deploy pdf-server to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'pdf-server/**'
      - '.github/workflows/pdf-server-deploy.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional: redeploy a previous commit SHA (40-char hash)'
        required: false
        type: string

# Hard-coded for the document-centre-prod-dc project. Update GCP_PROJECT_ID
# in repository variables if the project ID ever changes.
env:
  GCP_PROJECT_ID: project-59a14b18-b4df-4c6b-b09
  GCP_PROJECT_NUMBER: '622687766375'
  GCP_REGION: africa-south1
  AR_REPO: dc-pdf
  IMAGE_NAME: server
  WIF_PROVIDER: projects/622687766375/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deployer@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com
  RUNTIME_SA: dc-pdf-runtime@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          DATABASE_URL: ${{ secrets.PDF_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PDF_REDIS_URL }}
          CELERY_BROKER_URL: ${{ secrets.PDF_CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.PDF_CELERY_RESULT_BACKEND }}
        run: |
          missing=()
          for v in DATABASE_URL REDIS_URL CELERY_BROKER_URL CELERY_RESULT_BACKEND; do
            if [ -z "${!v}" ]; then missing+=("PDF_$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Add them at: Settings → Secrets and variables → Actions"
            exit 1
          fi

      - name: Resolve image tag
        id: tag
        run: |
          SHA="${{ github.event.inputs.rollback_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build image
        if: github.event.inputs.rollback_sha == ''
        run: |
          docker build \
            -f pdf-server/Dockerfile \
            -t "${{ steps.tag.outputs.image }}" \
            .

      - name: Push image
        if: github.event.inputs.rollback_sha == ''
        run: docker push "${{ steps.tag.outputs.image }}"

      - name: Write runtime env file
        env:
          DATABASE_URL: ${{ secrets.PDF_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PDF_REDIS_URL }}
          CELERY_BROKER_URL: ${{ secrets.PDF_CELERY_BROKER_URL }}
          CELERY_RESULT_BACKEND: ${{ secrets.PDF_CELERY_RESULT_BACKEND }}
          SUPABASE_URL: ${{ secrets.PDF_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PDF_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_STORAGE_BUCKET: ${{ secrets.PDF_SUPABASE_STORAGE_BUCKET }}
          AWS_S3_BUCKET: ${{ secrets.PDF_AWS_S3_BUCKET }}
          AWS_S3_REGION: ${{ secrets.PDF_AWS_S3_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.PDF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.PDF_AWS_SECRET_ACCESS_KEY }}
          STORAGE_MODE: ${{ secrets.PDF_STORAGE_MODE }}
          SECRET_KEY: ${{ secrets.PDF_SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.PDF_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.PDF_ADMIN_PASSWORD }}
          CORS_ORIGINS: ${{ secrets.PDF_CORS_ORIGINS }}
        run: |
          # Build a YAML env file for --env-vars-file so values with commas/special chars are safe.
          python3 - <<'PY' > /tmp/runtime.env.yaml
          import os, yaml
          keys = [
              "DATABASE_URL","REDIS_URL","CELERY_BROKER_URL","CELERY_RESULT_BACKEND",
              "SUPABASE_URL","SUPABASE_SERVICE_ROLE_KEY","SUPABASE_STORAGE_BUCKET",
              "AWS_S3_BUCKET","AWS_S3_REGION","AWS_ACCESS_KEY_ID","AWS_SECRET_ACCESS_KEY",
              "STORAGE_MODE","SECRET_KEY","ADMIN_USERNAME","ADMIN_PASSWORD","CORS_ORIGINS",
          ]
          out = {k: os.environ[k] for k in keys if os.environ.get(k)}
          print(yaml.safe_dump(out, default_flow_style=False))
          PY

      - name: Deploy pdf-api (HTTP)
        run: |
          gcloud run deploy pdf-api \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --port=8080 \
            --env-vars-file=/tmp/runtime.env.yaml \
            --update-env-vars="ROLE=api,LOG_LEVEL=INFO" \
            --memory=1Gi --cpu=1 \
            --concurrency=80 \
            --min-instances=0 --max-instances=10 \
            --timeout=300 \
            --allow-unauthenticated \
            --quiet

      - name: Deploy pdf-worker-heavy (internal)
        run: |
          gcloud run deploy pdf-worker-heavy \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --env-vars-file=/tmp/runtime.env.yaml \
            --update-env-vars="ROLE=worker-heavy,LOG_LEVEL=INFO" \
            --memory=4Gi --cpu=2 \
            --concurrency=1 \
            --min-instances=0 --max-instances=5 \
            --timeout=900 \
            --no-allow-unauthenticated \
            --quiet

      - name: Deploy pdf-worker-light (internal)
        run: |
          gcloud run deploy pdf-worker-light \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --env-vars-file=/tmp/runtime.env.yaml \
            --update-env-vars="ROLE=worker-light,LOG_LEVEL=INFO" \
            --memory=2Gi --cpu=1 \
            --concurrency=8 \
            --min-instances=0 --max-instances=10 \
            --timeout=600 \
            --no-allow-unauthenticated \
            --quiet

      - name: Summary
        run: |
          {
            echo "## Deployed"
            echo ""
            echo "- **Image**: \`${{ steps.tag.outputs.image }}\`"
            echo "- **Commit**: \`${{ steps.tag.outputs.sha }}\`"
            echo "- **Region**: ${{ env.GCP_REGION }}"
            echo ""
            echo "### Services"
            echo "- pdf-api"
            echo "- pdf-worker-heavy"
            echo "- pdf-worker-light"
          } >> "$GITHUB_STEP_SUMMARY"
