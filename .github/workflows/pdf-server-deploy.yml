name: Deploy pdf-server to Cloud Run

# Phase 1 of the GCP cutover (see .lovable/plan.md):
#   - Builds the image, pushes to Artifact Registry.
#   - Deploys ONLY the pdf-api service (FastAPI sync endpoints).
#   - All runtime config comes from GCP Secret Manager via --set-secrets.
#   - Celery workers, beat, and the email listener stay on the VPS until
#     Phase 3 / Phase 5 of the plan.
#
# Required Secret Manager entries (create once via pdf-server/docker/secrets-bootstrap.sh):
#   PDF_DATABASE_URL, PDF_SUPABASE_URL, PDF_SUPABASE_SERVICE_ROLE_KEY,
#   PDF_STORAGE_MODE, PDF_AWS_S3_BUCKET, PDF_AWS_S3_REGION,
#   PDF_AWS_ACCESS_KEY_ID, PDF_AWS_SECRET_ACCESS_KEY,
#   PDF_SECRET_KEY, PDF_CORS_ORIGINS
# Optional: PDF_SUPABASE_STORAGE_BUCKET, PDF_ADMIN_USERNAME, PDF_ADMIN_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'pdf-server/**'
      - '.github/workflows/pdf-server-deploy.yml'
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Optional: redeploy a previous commit SHA (40-char hash)'
        required: false
        type: string

env:
  GCP_PROJECT_ID: project-59a14b18-b4df-4c6b-b09
  GCP_PROJECT_NUMBER: '622687766375'
  GCP_REGION: africa-south1
  # Cloud Tasks + Cloud Scheduler are not offered in africa-south1.
  # Queue control plane lives in europe-west1; pushes back into africa-south1 Cloud Run.
  GCP_TASKS_REGION: europe-west1
  AR_REPO: dc-pdf
  IMAGE_NAME: server
  WIF_PROVIDER: projects/622687766375/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deployer@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com
  RUNTIME_SA: dc-pdf-runtime@project-59a14b18-b4df-4c6b-b09.iam.gserviceaccount.com

permissions:
  contents: read
  id-token: write   # required for Workload Identity Federation

# Silence the Node 20 deprecation warning on the runner. Safe to remove once
# google-github-actions/* ship Node 24 builds.
defaults:
  run:
    shell: bash

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: |
          SHA="${{ github.event.inputs.rollback_sha || github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}:$SHA" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GCP (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Verify required Secret Manager entries exist
        run: |
          required=(PDF_DATABASE_URL PDF_SUPABASE_URL PDF_SUPABASE_SERVICE_ROLE_KEY \
                    PDF_SECRET_KEY PDF_CORS_ORIGINS PDF_STORAGE_MODE \
                    PDF_AWS_S3_BUCKET PDF_AWS_S3_REGION \
                    PDF_AWS_ACCESS_KEY_ID PDF_AWS_SECRET_ACCESS_KEY)
          missing=()
          denied=()
          for s in "${required[@]}"; do
            err=$(gcloud secrets describe "$s" --project="${GCP_PROJECT_ID}" 2>&1 >/dev/null) && continue
            if echo "$err" | grep -qi 'PERMISSION_DENIED\|does not have permission'; then
              denied+=("$s")
            else
              missing+=("$s")
            fi
          done
          if [ ${#denied[@]} -gt 0 ]; then
            echo "::error::Deploy SA cannot read these secrets (PERMISSION_DENIED): ${denied[*]}"
            echo "::error::Fix with ONE of (run in Cloud Shell):"
            echo "::error::  A) bash pdf-server/docker/secrets-bootstrap.sh --iam-only"
            echo "::error::  B) bash pdf-server/docker/gcp-setup.sh"
            echo "::error::  C) gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} \\"
            echo "::error::       --member=serviceAccount:${DEPLOY_SA} --role=roles/secretmanager.viewer"
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing Secret Manager entries: ${missing[*]}"
            echo "Create them by running: bash pdf-server/docker/secrets-bootstrap.sh"
            exit 1
          fi


      - name: Verify deploy SA can read Cloud Run logs
        run: |
          # Without roles/logging.viewer the post-deploy log dump returns
          # PERMISSION_DENIED and hides the real Cloud Run startup error.
          # Fail fast with the exact grant command instead.
          if ! err=$(gcloud logging read \
                'resource.type="cloud_run_revision" AND resource.labels.service_name="pdf-api"' \
                --project="${GCP_PROJECT_ID}" --limit=1 --format='value(timestamp)' 2>&1); then
            if echo "$err" | grep -qi 'PERMISSION_DENIED\|does not have permission'; then
              echo "::error::Deploy SA lacks roles/logging.viewer — Cloud Run startup logs cannot be read."
              echo "::error::Run ONE of (in Cloud Shell):"
              echo "::error::  A) bash pdf-server/docker/gcp-setup.sh"
              echo "::error::  B) gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} \\"
              echo "::error::       --member=serviceAccount:${DEPLOY_SA} \\"
              echo "::error::       --role=roles/logging.viewer --condition=None"
              exit 1
            fi
            echo "::warning::Unexpected error probing Cloud Run logs: $err"
          fi

      - name: Build image
        if: github.event.inputs.rollback_sha == ''
        run: |
          docker build \
            -f pdf-server/Dockerfile \
            -t "${{ steps.tag.outputs.image }}" \
            .

      - name: Container boot smoke test (catch startup failures before Cloud Run rollout)
        if: github.event.inputs.rollback_sha == ''
        run: |
          # Start the same ROLE=api entrypoint Cloud Run uses, bind PORT=8080,
          # and require /health to answer before deploying. Single worker +
          # debug logging so any Python traceback shows up in docker logs.
          cid=$(docker run -d \
            -e ROLE=api \
            -e PORT=8080 \
            -e UVICORN_WORKERS=1 \
            -e LOG_LEVEL=debug \
            -e PYTHONUNBUFFERED=1 \
            -e APP_DEBUG=true \
            -e DATABASE_URL="postgresql+psycopg://u:p@127.0.0.1:5432/db" \
            -e STORAGE_MODE=s3 \
            -e AWS_S3_BUCKET=smoke -e AWS_S3_REGION=af-south-1 \
            -e AWS_ACCESS_KEY_ID=smoke -e AWS_SECRET_ACCESS_KEY=smoke \
            -e SECRET_KEY=smoke \
            -e CORS_ORIGINS="http://localhost" \
            -p 127.0.0.1:8080:8080 \
            "${{ steps.tag.outputs.image }}")

          dump_logs() {
            echo "===== docker logs (pdf-api smoke) ====="
            docker logs "$cid" 2>&1 || true
            echo "===== end docker logs ====="
          }
          cleanup() { dump_logs; docker rm -f "$cid" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8080/health >/tmp/pdf-api-health.json 2>/dev/null; then
              echo "/health OK:"
              cat /tmp/pdf-api-health.json
              exit 0
            fi
            running=$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || echo "missing")
            if [ "$running" != "true" ]; then
              status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo unknown)
              exit_code=$(docker inspect -f '{{.State.ExitCode}}' "$cid" 2>/dev/null || echo unknown)
              echo "::error::Container exited before /health became ready (status=$status, exit_code=$exit_code)"
              exit 1
            fi
            sleep 2
          done

          echo "::error::Container did not answer /health on PORT=8080 within 90s"
          exit 1

      - name: Push image
        if: github.event.inputs.rollback_sha == ''
        run: docker push "${{ steps.tag.outputs.image }}"

      - name: Deploy pdf-api (HTTP)
        run: |
          # Optional secrets are added to --set-secrets only if they exist,
          # so the first deploy works even before AWS / admin secrets are set.
          BASE_SECRETS=(
            "DATABASE_URL=PDF_DATABASE_URL:latest"
            "SUPABASE_URL=PDF_SUPABASE_URL:latest"
            "SUPABASE_SERVICE_ROLE_KEY=PDF_SUPABASE_SERVICE_ROLE_KEY:latest"
            "SECRET_KEY=PDF_SECRET_KEY:latest"
            "CORS_ORIGINS=PDF_CORS_ORIGINS:latest"
            "STORAGE_MODE=PDF_STORAGE_MODE:latest"
            "AWS_S3_BUCKET=PDF_AWS_S3_BUCKET:latest"
            "AWS_S3_REGION=PDF_AWS_S3_REGION:latest"
            "AWS_ACCESS_KEY_ID=PDF_AWS_ACCESS_KEY_ID:latest"
            "AWS_SECRET_ACCESS_KEY=PDF_AWS_SECRET_ACCESS_KEY:latest"
          )
          OPTIONAL=(
            "SUPABASE_STORAGE_BUCKET=PDF_SUPABASE_STORAGE_BUCKET"
            "ADMIN_USERNAME=PDF_ADMIN_USERNAME"
            "ADMIN_PASSWORD=PDF_ADMIN_PASSWORD"
            # Shared secret used by the Supabase Database Webhook that
            # replaces the VPS LISTEN/NOTIFY listener. Optional so deploys
            # don't break before the secret is created.
            "EMAIL_NOTIFY_TOKEN=PDF_EMAIL_NOTIFY_TOKEN"
          )
          SECRETS=("${BASE_SECRETS[@]}")
          for entry in "${OPTIONAL[@]}"; do
            env_name="${entry%%=*}"
            sec_name="${entry##*=}"
            if gcloud secrets describe "$sec_name" --project="${GCP_PROJECT_ID}" >/dev/null 2>&1; then
              SECRETS+=("${env_name}=${sec_name}:latest")
            fi
          done
          SECRET_FLAG=$(IFS=,; echo "${SECRETS[*]}")

          set +e
          gcloud run deploy pdf-api \
            --image="${{ steps.tag.outputs.image }}" \
            --region="${{ env.GCP_REGION }}" \
            --service-account="${{ env.RUNTIME_SA }}" \
            --port=8080 \
            --set-env-vars="ROLE=api,LOG_LEVEL=INFO,APP_ENV=production,UVICORN_WORKERS=1,PYTHONUNBUFFERED=1,QUEUE_BACKEND=cloud_tasks,GCP_PROJECT_ID=${{ env.GCP_PROJECT_ID }},GCP_REGION=${{ env.GCP_REGION }},GCP_TASKS_REGION=${{ env.GCP_TASKS_REGION }}" \
            --set-secrets="$SECRET_FLAG" \
            --memory=1Gi --cpu=1 \
            --cpu-boost \
            --concurrency=80 \
            --min-instances=0 --max-instances=10 \
            --timeout=300 \
            --allow-unauthenticated \
            --quiet
          deploy_rc=$?
          set -e
          if [ $deploy_rc -ne 0 ]; then
            echo "::error::gcloud run deploy failed (rc=$deploy_rc). Dumping recent Cloud Run logs for pdf-api:"
            echo "===== cloud run logs (pdf-api, last 200) ====="
            gcloud logging read \
              'resource.type="cloud_run_revision" AND resource.labels.service_name="pdf-api"' \
              --project="${GCP_PROJECT_ID}" \
              --limit=200 \
              --order=desc \
              --format='value(timestamp,severity,textPayload,jsonPayload.message)' || true
            echo "===== end cloud run logs ====="
            exit $deploy_rc
          fi

      - name: Deploy HTTP workers (Cloud Tasks targets)
        run: |
          # Same image, different ROLE. Each service gets its own scaling
          # envelope. Cloud Tasks pushes /internal/tasks/* requests here.
          # NOT --allow-unauthenticated — only the cloud-tasks-invoker SA
          # (created by gcp-tasks-bootstrap.sh) may invoke. WORKER_SELF_URL
          # is set in a second pass below once the URL exists.
          SECRETS=(
            "DATABASE_URL=PDF_DATABASE_URL:latest"
            "SUPABASE_URL=PDF_SUPABASE_URL:latest"
            "SUPABASE_SERVICE_ROLE_KEY=PDF_SUPABASE_SERVICE_ROLE_KEY:latest"
            "SECRET_KEY=PDF_SECRET_KEY:latest"
            "CORS_ORIGINS=PDF_CORS_ORIGINS:latest"
            "STORAGE_MODE=PDF_STORAGE_MODE:latest"
            "AWS_S3_BUCKET=PDF_AWS_S3_BUCKET:latest"
            "AWS_S3_REGION=PDF_AWS_S3_REGION:latest"
            "AWS_ACCESS_KEY_ID=PDF_AWS_ACCESS_KEY_ID:latest"
            "AWS_SECRET_ACCESS_KEY=PDF_AWS_SECRET_ACCESS_KEY:latest"
          )
          SECRET_FLAG=$(IFS=,; echo "${SECRETS[*]}")

          deploy_worker() {
            local name="$1" role="$2" cpu="$3" mem="$4" max="$5" min="${6:-0}"
            gcloud run deploy "$name" \
              --image="${{ steps.tag.outputs.image }}" \
              --region="${{ env.GCP_REGION }}" \
              --service-account="${{ env.RUNTIME_SA }}" \
              --port=8080 \
              --set-env-vars="ROLE=${role},LOG_LEVEL=INFO,APP_ENV=production,UVICORN_WORKERS=1,PYTHONUNBUFFERED=1" \
              --set-secrets="$SECRET_FLAG" \
              --memory="$mem" --cpu="$cpu" \
              --cpu-boost \
              --concurrency=1 \
              --min-instances="$min" --max-instances="$max" \
              --timeout=900 \
              --no-allow-unauthenticated \
              --quiet

            # Second pass: set WORKER_SELF_URL so OIDC verification can match audience.
            url=$(gcloud run services describe "$name" --region="${{ env.GCP_REGION }}" --format='value(status.url)')
            gcloud run services update "$name" \
              --region="${{ env.GCP_REGION }}" \
              --update-env-vars="WORKER_SELF_URL=$url" --quiet
          }

          deploy_worker pdf-worker-heavy  worker-heavy-http  2 4Gi  5
          # Light worker: customer-facing thumbnail render. Already parallel
          # via ThreadPoolExecutor(max_workers=os.cpu_count()-1) — bumping
          # CPU/RAM linearly speeds up wall-clock at ~neutral cost (Cloud
          # Run bills vCPU-seconds). Fan-out is force-disabled under Cloud
          # Tasks (see generate_previews) so the whole job runs inside
          # ONE container — this CPU/RAM allocation matters.
          deploy_worker pdf-worker-light  worker-light-http  4 4Gi  20
          # Emails: bumped max-instances 10 → 20 and pinned min=1 so the
          # first email after a quiet period doesn't pay a cold start.
          # 512 MiB × 1 min-instance ≈ trivial cost vs. SMTP latency saved.
          deploy_worker pdf-worker-emails worker-emails-http 1 512Mi 20 1


      - name: Wire Cloud Tasks env vars on pdf-api
        run: |
          # Single second-pass update on pdf-api: BEAT_SELF_URL (for OIDC
          # audience on beat endpoints) + the Cloud Tasks enqueue config
          # (TASKS_INVOKER_SA + per-queue worker URLs). Folded into one
          # `gcloud run services update` so we only burn one extra revision.
          # QUEUE_BACKEND=cloud_tasks is set in the initial deploy step so
          # app.core.queue.enqueue routes through Cloud Tasks (not Celery).
          api_url=$(gcloud run services describe pdf-api          --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          heavy_url=$(gcloud run services describe pdf-worker-heavy  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          light_url=$(gcloud run services describe pdf-worker-light  --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          emails_url=$(gcloud run services describe pdf-worker-emails --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          invoker_sa="cloud-tasks-invoker@${{ env.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

          gcloud run services update pdf-api \
            --region="${{ env.GCP_REGION }}" \
            --update-env-vars="BEAT_SELF_URL=${api_url},TASKS_INVOKER_SA=${invoker_sa},WORKER_URL_HEAVY=${heavy_url},WORKER_URL_LIGHT=${light_url},WORKER_URL_EMAILS=${emails_url},QUEUE_BACKEND=cloud_tasks" \
            --quiet

      - name: Summary
        run: |
          URL=$(gcloud run services describe pdf-api --region="${{ env.GCP_REGION }}" --format='value(status.url)')
          H=$(gcloud run services describe pdf-worker-heavy  --region="${{ env.GCP_REGION }}" --format='value(status.url)' 2>/dev/null || echo "-")
          L=$(gcloud run services describe pdf-worker-light  --region="${{ env.GCP_REGION }}" --format='value(status.url)' 2>/dev/null || echo "-")
          E=$(gcloud run services describe pdf-worker-emails --region="${{ env.GCP_REGION }}" --format='value(status.url)' 2>/dev/null || echo "-")
          {
            echo "## Deployed"
            echo ""
            echo "- **pdf-api**: $URL"
            echo "- **pdf-worker-heavy**: $H"
            echo "- **pdf-worker-light**: $L"
            echo "- **pdf-worker-emails**: $E"
            echo "- **Image**: \`${{ steps.tag.outputs.image }}\`"
            echo "- **Commit**: \`${{ steps.tag.outputs.sha }}\`"
            echo "- **Region**: ${{ env.GCP_REGION }}"
            echo ""
            echo "_First-time setup: run \`bash pdf-server/docker/gcp-tasks-bootstrap.sh\` in Cloud Shell to create Cloud Tasks queues, the invoker SA, and Cloud Scheduler jobs._"
            echo "_QUEUE_BACKEND is pinned to \`cloud_tasks\` on pdf-api so \`app.core.queue.enqueue\` pushes via Cloud Tasks (not Celery/Redis)._"
          } >> "$GITHUB_STEP_SUMMARY"
